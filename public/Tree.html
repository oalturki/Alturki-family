<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>الشجرة الموثّقة</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  :root{
    --teal-950:#0d2b2b;
    --teal-900:#123838;
    --teal-800:#1a4d4d;
    --teal-700:#1f6161;
    --sand-100:#f6f1e6;
    --sand-200:#efe6d2;
    --gold-500:#c9a227;
    --gold-400:#dab94a;
    --line:#8fae9f;
    --virtual:#b9c7bd;
    --text-dark:#16241f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--sand-100);font-family:'Tahoma','Segoe UI',sans-serif;color:var(--text-dark);}
  #headerWrap{position:fixed;top:0;left:0;right:0;z-index:11;}
  #headerImg{
    display:block;width:100%;height:56px;object-fit:cover;object-position:center 35%;
    border-bottom:2px solid var(--gold-500);
  }
  #topbar{
    position:static;
    background:linear-gradient(180deg,var(--teal-950),var(--teal-900));
    color:var(--sand-100);
    padding:10px 16px;
    display:flex;align-items:center;gap:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.25);
    border-bottom:2px solid var(--gold-500);
  }
  #topbar h1{
    font-size:19px;margin:0;font-weight:700;letter-spacing:.5px;
    display:flex;align-items:center;gap:10px;
  }
  #topbar h1 .mark{
    width:10px;height:10px;border-radius:50%;background:var(--gold-500);
    box-shadow:0 0 0 3px rgba(201,162,39,.25);
  }
  #searchToggle{
    background:var(--teal-800);border:1px solid var(--teal-700);color:var(--sand-100);
    border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer;margin-inline-start:auto;
  }
  #panelWrap{
    position:static;z-index:9;
    background:var(--teal-900);padding:12px 16px;border-bottom:2px solid var(--gold-500);
    display:none;flex-direction:column;gap:10px;
  }
  #panelWrap.open{display:flex;}
  #searchWrap{position:relative;}
  #searchWrap #search{width:100%;box-sizing:border-box;}
  #search{
    width:280px;padding:9px 14px;border-radius:8px;border:1px solid var(--teal-700);
    background:var(--teal-800);color:var(--sand-100);font-size:14px;outline:none;
  }
  #search::placeholder{color:#bcd0cb;}
  #search:focus{border-color:var(--gold-400);}
  #searchResults{
    position:fixed;width:320px;max-height:340px;overflow:auto;
    background:var(--sand-100);border:1px solid var(--teal-700);border-radius:8px;
    box-shadow:0 8px 24px rgba(0,0,0,.3); display:none; z-index:9999;
  }
  .searchItem{padding:9px 12px;font-size:13.5px;cursor:pointer;border-bottom:1px solid var(--sand-200);}
  .searchItem:hover{background:var(--sand-200);}
  .searchItem b{color:var(--teal-900);}
  .searchItem .sub{color:#6b7a72;font-size:11.5px;}
  #legend{display:flex;gap:14px;font-size:12px;align-items:center;color:#dce8e2;flex-wrap:wrap;}
  .legendItem{display:flex;align-items:center;gap:6px;}
  .swatch{width:12px;height:12px;border-radius:3px;display:inline-block;}
  #stats{font-size:12px;color:#a9c2ba;margin-inline-start:6px;}
  #controls{display:flex;gap:6px;}
  #controls button{
    background:var(--teal-800);color:var(--sand-100);border:1px solid var(--teal-700);
    border-radius:6px;padding:7px 10px;cursor:pointer;font-size:13px;
  }
  #controls button:hover{background:var(--teal-700);}
  #canvasWrap{position:absolute;top:64px;bottom:0;left:0;right:0;overflow:hidden;}
  svg{width:100%;height:100%;cursor:grab;}
  svg:active{cursor:grabbing;}
  .link{fill:none;stroke:var(--line);stroke-width:1.6px;}
  .node rect{stroke-width:1.6px;cursor:pointer;}
  .node.real rect{fill:var(--sand-100);stroke:var(--teal-800);}
  .node.real.hasphone rect{fill:#dff0e4;stroke:var(--teal-700);}
  .node.virtual rect{fill:var(--sand-200);stroke:var(--virtual);stroke-dasharray:3,2;}
  .node.ambiguous rect{stroke:var(--gold-500);stroke-width:2.4px;}
  .node text{
    font-size:12.5px;fill:var(--text-dark);pointer-events:none;
  }
  .ornate-frame{
    stroke: var(--teal-800); stroke-width: 2px; fill: none;
  }
  .ancestry-box rect{
    fill:var(--sand-200);stroke:var(--gold-500);stroke-width:1.6px;
  }
  .ancestry-box text{
    font-size:14px;font-weight:700;fill:#6b5320;font-style:italic;pointer-events:none;
  }
  .title-box rect{
    fill:var(--teal-800);stroke:var(--gold-500);stroke-width:1.6px;
  }
  .title-box text{
    pointer-events:none;
  }
  .node.virtual text{fill:#5a6b62;font-style:italic;}
  .node.highlight rect{stroke:#c0392b;stroke-width:3px;}
  #tooltip{
    position:fixed;pointer-events:none;background:var(--teal-950);color:var(--sand-100);
    padding:8px 12px;border-radius:8px;font-size:13px;line-height:1.6;
    box-shadow:0 6px 18px rgba(0,0,0,.35);display:none;z-index:30;border:1px solid var(--gold-500);
    max-width:280px;
  }
  #tooltip .t-name{font-weight:700;font-size:14.5px;color:var(--gold-400);margin-bottom:2px;}
  #hint{
    position:fixed;bottom:14px;right:50%;transform:translateX(50%);
    background:rgba(13,43,43,.9);color:var(--sand-100);padding:7px 16px;border-radius:20px;
    font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:15;
  }
</style>
</head>

<script>
const TREE_DATA = TREE_DATA_FULL;

const svg = d3.select('#svg');
const canvasWrap = document.getElementById('canvasWrap');
let width = canvasWrap.clientWidth, height = canvasWrap.clientHeight;

const g = svg.append('g');
const gLinks = g.append('g').attr('class','links-layer');
const gNodes = g.append('g').attr('class','nodes-layer');

// decorative title box, shown above the root (تركي)
const TITLE_LINES = [
  {text: 'شجرة أنساب عائلة آل تركي', size: 19, weight: 800},
  {text: 'من قبيلة الدواسر فخذ البدارين', size: 15, weight: 600},
  {text: 'أعدها في طبعتها الأولى عام ١٣٩٨هـ حمد بن عبدالله بن حمد التركي رحمه الله', size: 10, weight: 400},
  {text: 'أتمها وصححها محمد بن تركي بن سليمان التركي', size: 10, weight: 400},
];

const gTitle = g.append('g').attr('class', 'title-box');
const TITLE_IMG_W = 460, TITLE_IMG_H = 460 * (768/1408);
const titleImage = gTitle.append('image')
  .attr('href', document.getElementById('headerImg') ? document.getElementById('headerImg').src : '')
  .attr('width', TITLE_IMG_W).attr('height', TITLE_IMG_H)
  .attr('rx', 10)
  .style('filter','drop-shadow(0 2px 6px rgba(0,0,0,.35))');


const zoom = d3.zoom().scaleExtent([0.05, 3]).on('zoom', (ev)=>{ g.attr('transform', ev.transform); });
svg.call(zoom);

const dx = 95;
const dy = 90;

const treeLayout = d3.tree().nodeSize([dx, dy]);

const root = d3.hierarchy(TREE_DATA, d => d.children);
root.x0 = 0;
root.y0 = 0;

let totalReal = 0, totalVirtual = 0, totalPhone = 0, totalAmbiguous = 0;
root.each(d => {
  if(d.data.virtual){ totalVirtual++; }
  else { totalReal++; if(d.data.phone) totalPhone++; if(d.data.ambiguous) totalAmbiguous++; }
});
document.getElementById('stats').textContent =
  `${totalReal} فرد مُدرج · ${totalPhone} برقم جوال · ${totalVirtual} جد/فرع افتراضي · ${totalAmbiguous} يحتاج مراجعة`;

function collapse(d){
  if(d.children){
    d._children = d.children;
    d._children.forEach(collapse);
    d.children = null;
  }
}
// walk down the single-child trunk chain (تركي > عثمان > إبراهيم > محمد) keeping it expanded,
// then collapse starting at محمد's own children so the branches are hidden until محمد is clicked
let trunkNode = root;
while(trunkNode.children && trunkNode.children.length === 1){
  trunkNode = trunkNode.children[0];
}
if(trunkNode.children){
  collapse(trunkNode);
}

let i = 0;
const tooltip = document.getElementById('tooltip');

function update(source){
  const treeData = treeLayout(root);
  const nodes = treeData.descendants();
  const links = treeData.links();

  nodes.forEach(d => { d.y = d.depth * dy; });

  // title image positioned directly above the root node (تركي's box now includes the ancestry line itself)
  const rootBoxH = root.boxH || 56;
  const titleY = root.y - rootBoxH/2 - TITLE_IMG_H - 34;
  titleImage.attr('x', root.x - TITLE_IMG_W/2).attr('y', titleY);
  gTitle.raise();

  const node = gNodes.selectAll('g.node')
    .data(nodes, d => d.data.id || (d.id || (d.id = ++i)));

  const nodeEnter = node.enter().append('g')
    .attr('class', d => 'node ' + (d.data.virtual ? 'virtual' : 'real') + (d.data.phone ? ' hasphone' : '') + (d.data.ambiguous ? ' ambiguous' : ''))
    .attr('transform', d => `translate(${source.x0 || 0},${source.y0 || 0})`)
    .on('click', (event, d) => {
      if(d.children || d._children){
        toggle(d);
        update(d);
      }
    })
    .on('mouseenter', (event, d) => showTip(event, d))
    .on('mousemove', (event) => moveTip(event))
    .on('mouseleave', hideTip);

  nodeEnter.append('rect')
    .attr('rx', 8).attr('ry', 8)
    .attr('x', -10).attr('y', -14)
    .attr('width', 20).attr('height', 28);

  nodeEnter.each(function(d){
    const sel = d3.select(this);
    sel.append('text')
      .attr('dy', '0.32em')
      .attr('x', 0)
      .attr('text-anchor', 'middle')
      .text(d.data.name);
  });

  function depthFontSize(depth){
    if(depth === 0) return 28;   // تركي (الأكبر)
    if(depth === 1) return 23;   // عثمان
    if(depth === 2) return 20;   // إبراهيم
    if(depth === 3) return 17;   // محمد
    if(depth === 4) return 15;   // الفروع الرئيسية (عبدالرحمن/ناصر/إبراهيم)
    return 12.5;                 // باقي الفروع
  }
  function depthFontWeight(depth){
    if(depth === 0) return 900;
    if(depth === 1) return 850;
    if(depth === 2) return 800;
    if(depth === 3) return 750;
    if(depth === 4) return 650;
    return 500;
  }

  const nodeUpdate = nodeEnter.merge(node);
  nodeUpdate.transition().duration(350)
    .attr('transform', d => `translate(${d.x},${d.y})`);

  nodeUpdate.each(function(d){
    const sel = d3.select(this);
    sel.select('text')
      .style('font-size', depthFontSize(d.depth) + 'px')
      .style('font-weight', depthFontWeight(d.depth));
  });

  nodeUpdate.each(function(d){
    const g = d3.select(this);
    const textEl = g.select('text').node();
    const textW = textEl ? textEl.getComputedTextLength() : 40;
    const padX = d.depth === 0 ? 30 : 16;
    const h = Math.max(30, depthFontSize(d.depth) + (d.depth === 0 ? 26 : 14));
    const w = Math.max(textW + padX*2, 40);
    g.select('rect')
      .attr('x', -w/2).attr('y', -h/2)
      .attr('width', w).attr('height', h);
    d.boxW = w; d.boxH = h;
  });

  node.exit().transition().duration(300)
    .attr('transform', d => `translate(${source.x},${source.y})`)
    .remove();

  const link = gLinks.selectAll('path.link')
    .data(links, d => d.target.data.id);

  const linkGen = d3.linkVertical()
    .x(d => d.x)
    .y(d => d.y + (d.boxH ? d.boxH/2 : 0) * (d.parent === undefined ? 0 : 1));

  function linkPath(l){
    const sx = l.source.x, sy = l.source.y + (l.source.boxH||30)/2;
    const tx = l.target.x, ty = l.target.y - (l.target.boxH||30)/2;
    const my = (sy + ty) / 2;
    return `M${sx},${sy} C${sx},${my} ${tx},${my} ${tx},${ty}`;
  }

  const linkEnter = link.enter().insert('path','g')
    .attr('class','link')
    .attr('d', d => {
      const o = {x: source.x0 || 0, y: source.y0 || 0, boxH: source.boxH||30};
      return linkPath({source:o, target:o});
    });

  linkEnter.merge(link).transition().duration(350)
    .attr('d', linkPath);

  link.exit().transition().duration(300)
    .attr('d', d => {
      const o = {x: source.x, y: source.y, boxH: source.boxH||30};
      return linkPath({source:o, target:o});
    }).remove();

  nodes.forEach(d => { d.x0 = d.x; d.y0 = d.y; });
}

function toggle(d){
  if(d.children){ d._children = d.children; d.children = null; }
  else { d.children = d._children; d._children = null; }
}

function showTip(event, d){
  const dd = d.data;
  let html = `<div class="t-name">${dd.name}</div>`;
  if(dd.virtual){
    html += `<div>متوفى رحمه الله</div>`;
  } else {
    html += `<div>المنطقة: ${dd.region || '—'}</div>`;
    html += `<div>الجوال: ${dd.phone || '— غير متوفر'}</div>`;
    if(dd.ambiguous) html += `<div style="color:#dab94a;margin-top:4px;">⚠ يحتاج مراجعة (أكثر من مرشح للأب)</div>`;
  }
  tooltip.innerHTML = html;
  tooltip.style.display = 'block';
  moveTip(event);
}
function moveTip(event){
  tooltip.style.left = (event.clientX + 16) + 'px';
  tooltip.style.top = (event.clientY + 12) + 'px';
}
function hideTip(){ tooltip.style.display = 'none'; }

update(root);

function centerView(){
  const scale = 0.9;
  const topY = root.y - (root.boxH || 56)/2 - TITLE_IMG_H - 34; // top edge of title image in tree-space
  const translateY = 20 - topY * scale; // small top padding
  const t = d3.zoomIdentity.translate(width/2, translateY).scale(scale);
  svg.call(zoom.transform, t);
}
centerView();

window.addEventListener('resize', () => {
  width = canvasWrap.clientWidth; height = canvasWrap.clientHeight;
});

document.getElementById('searchToggle').addEventListener('click', () => {
  document.getElementById('panelWrap').classList.toggle('open');
  syncCanvasTop();
});

function syncCanvasTop(){
  const h = document.getElementById('headerWrap').offsetHeight;
  document.getElementById('canvasWrap').style.top = h + 'px';
}
window.addEventListener('resize', syncCanvasTop);
syncCanvasTop();

document.getElementById('expandAll').addEventListener('click', () => {
  root.each(d => { if(d._children){ d.children = d._children; d._children = null; } });
  update(root);
});
document.getElementById('collapseAll').addEventListener('click', () => {
  root.each(d => { if(d !== root && d.children){ d._children = d.children; d.children = null; } });
  update(root);
  centerView();
});
document.getElementById('resetZoom').addEventListener('click', centerView);

const allNodesFlat = [];
(function walkRaw(n, parentChain){
  const entry = { data: n, chain: parentChain.concat([n.name]) };
  if(!n.virtual) allNodesFlat.push(entry);
  (n.children||[]).forEach(c => walkRaw(c, entry.chain));
})(TREE_DATA, []);

const searchInput = document.getElementById('search');
const searchResults = document.getElementById('searchResults');

function fullChainOf(entry){
  return entry.chain.slice().reverse().join(' بن ');
}

// map raw data node -> live d3 hierarchy node (for expanding/focusing on click)
const dataToHierarchyNode = new Map();
root.each(d => dataToHierarchyNode.set(d.data, d));
function findHierarchyNode(rawNode){
  // hierarchy nodes persist their .data reference even when collapsed into _children,
  // but root.each only walks .children — so also walk _children recursively once.
  let found = dataToHierarchyNode.get(rawNode);
  if(found) return found;
  function deepSearch(d){
    if(d.data === rawNode) return d;
    const kids = (d.children || d._children || []);
    for(const k of kids){
      const r = deepSearch(k);
      if(r) return r;
    }
    return null;
  }
  found = deepSearch(root);
  if(found) dataToHierarchyNode.set(rawNode, found);
  return found;
}

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim();
  if(q.length < 2){ searchResults.style.display='none'; return; }
  const rect = searchInput.getBoundingClientRect();
  searchResults.style.left = rect.left + 'px';
  searchResults.style.top = (rect.bottom + 6) + 'px';
  searchResults.style.width = rect.width + 'px';
  const matches = allNodesFlat.filter(entry => fullChainOf(entry).includes(q)).slice(0, 40);
  if(matches.length === 0){
    searchResults.innerHTML = '<div class="searchItem">لا نتائج</div>';
  } else {
    searchResults.innerHTML = matches.map((entry,idx) => {
      const chain = fullChainOf(entry);
      const n = entry.data;
      return `<div class="searchItem" data-idx="${idx}"><b>${n.name}</b><div class="sub">${chain} · ${n.region||''}${n.phone ? ' · '+n.phone : ''}</div></div>`;
    }).join('');
    searchResults.querySelectorAll('.searchItem').forEach((el, idx) => {
      el.addEventListener('click', () => {
        const hNode = findHierarchyNode(matches[idx].data);
        if(hNode) focusNode(hNode);
      });
    });
  }
  searchResults.style.display = 'block';
});

function focusNode(d){
  let cur = d.parent;
  while(cur){
    if(cur._children){ cur.children = cur._children; cur._children = null; }
    cur = cur.parent;
  }
  update(root);
  setTimeout(() => {
    const t = d3.zoomIdentity.translate(width/2 - d.x*0.9, height/2 - d.y*0.9).scale(0.9);
    svg.transition().duration(500).call(zoom.transform, t);
    d3.selectAll('g.node').classed('highlight', n => n.data.id === d.data.id);
  }, 380);
  searchResults.style.display = 'none';
}

document.addEventListener('click', (e) => {
  if(!searchWrap.contains(e.target)) searchResults.style.display = 'none';
});
const searchWrap = document.getElementById('searchWrap');
</script>
</body>
</html>
